<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кеш тефтер</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кеш тефтер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #eef2f0; --surface: #ffffff; --fg: #15201b; --muted: #5b6a63; --line: #d9e0dc;
  --in: #1d7a4c; --out: #b2412e; --accent: #0f5c4d; --on-in: #ffffff; --soft: #e3ebe7;
  --font-display: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1412; --surface: #172019; --fg: #e6eeea; --muted: #93a29b; --line: #29342f;
    --in: #4cc38a; --out: #f0806b; --accent: #5cc4ab; --on-in: #0b1511; --soft: #1e2924;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.balance h1 { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.05; margin: 4px 0 10px; letter-spacing: -.02em; }
.month { display: flex; gap: 20px; flex-wrap: wrap; }
.month div { display: flex; flex-direction: column; }
.month b { font-family: var(--font-display); font-size: 18px; }
.c-in { color: var(--in); } .c-out { color: var(--out); }
.muted { font-size: 13px; color: var(--muted); }
.pad, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 16px var(--font-body); padding: 11px; border-radius: 9px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg button[data-type="out"][aria-pressed="true"] { color: var(--out); }
.seg button[data-type="in"][aria-pressed="true"] { color: var(--in); }
.amount { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.amount:focus-within { border-color: var(--accent); }
.amount input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: 800 40px var(--font-display); font-variant-numeric: tabular-nums; padding: 0; }
.amount span { font: 700 26px var(--font-display); color: var(--muted); }
.note { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 11px 12px; font: 16px var(--font-body); }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cats button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 12px; padding: 16px 4px; font: 600 15px var(--font-body); }
.cats button:active { transform: scale(.96); border-color: var(--out); }
.hint { font-size: 13px; color: var(--muted); margin: -4px 0 0; }
.primary { width: 100%; border: 0; background: var(--in); color: var(--on-in); font: 700 17px var(--font-display); padding: 16px; border-radius: 12px; }
.err { color: var(--out); font-size: 13px; min-height: 1em; margin: -6px 0 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card h2 { font: 700 17px var(--font-display); margin: 0; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 10px; font-size: 14px; }
.track { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; background: var(--out); border-radius: 99px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.what { min-width: 0; }
.what b { font-weight: 600; display: block; }
.what small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.amt { font: 700 16px var(--font-display); }
.del { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--font-body); padding: 8px; border-radius: 8px; }
.del.confirm { background: var(--out); color: #fff; }
.more { border: 1px solid var(--line); background: transparent; color: var(--fg); font: 600 14px var(--font-body); padding: 11px; border-radius: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="app">
  <section class="balance" aria-live="polite">
    <div class="label">Налични пари</div>
    <h1 class="num" id="balance">0,00 €</h1>
    <div class="label" id="monthName" style="margin-bottom:4px">Този месец</div>
    <div class="month">
      <div><span class="muted">Приходи</span><b class="num c-in" id="mIn">0,00 €</b></div>
      <div><span class="muted">Разходи</span><b class="num c-out" id="mOut">0,00 €</b></div>
    </div>
  </section>

  <section class="pad" aria-label="Нов запис">
    <div class="seg" role="group" aria-label="Вид">
      <button type="button" id="tOut" data-type="out" aria-pressed="true">− Харча</button>
      <button type="button" id="tIn" data-type="in" aria-pressed="false">+ Добавям</button>
    </div>
    <label class="amount">
      <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Сума">
      <span>€</span>
    </label>
    <input id="note" class="note" autocomplete="off" placeholder="Бележка (по желание)" aria-label="Бележка">
    <p class="err" id="err"></p>
    <div id="outBox">
      <p class="hint">Избери за какво. Записва се веднага.</p>
      <div class="cats" id="cats" style="margin-top:12px"></div>
    </div>
    <div id="inBox" hidden>
      <button type="button" class="primary" id="addIn">Добави приход</button>
    </div>
  </section>

  <section class="card">
    <h2>Разходи този месец</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card">
    <h2>Последни записи</h2>
    <div class="list" id="list"></div>
    <button type="button" class="more" id="more" hidden>Покажи още</button>
  </section>

  <p class="muted" id="storageNote" style="text-align:center;margin:0">Данните се пазят само на този телефон.</p>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [
  { id: "food",   name: "Храна" },
  { id: "fuel",   name: "Гориво" },
  { id: "bills",  name: "Сметки" },
  { id: "family", name: "Семейство" },
  { id: "farm",   name: "Земеделие" },
  { id: "other",  name: "Други" }
];
const KEY = "kesh-tefter-entries";
const catName = id => (CATS.find(c => c.id === id) || { name: "Други" }).name;
const money = new Intl.NumberFormat("bg-BG", { style: "currency", currency: "EUR" });
const fmt = c => money.format(c / 100);
const dateFmt = new Intl.DateTimeFormat("bg-BG", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const monthFmt = new Intl.DateTimeFormat("bg-BG", { month: "long", year: "numeric" });
const $ = id => document.getElementById(id);

let entries = load();
let type = "out";
let shown = 30;

function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(entries)); return true; }
  catch { return false; }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

function parseAmount() {
  const raw = $("amount").value.trim().replace(/\s/g, "").replace(",", ".");
  const v = Number(raw);
  if (!raw || !isFinite(v) || v <= 0) return null;
  return Math.round(v * 100);
}
function save(cat) {
  const cents = parseAmount();
  if (cents === null) { $("err").textContent = "Напиши сума, например 12,50."; $("amount").focus(); return; }
  $("err").textContent = "";
  const e = {
    id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    type, amount: cents, cat: type === "out" ? cat : null,
    note: $("note").value.trim().slice(0, 120), ts: Date.now()
  };
  entries.push(e);
  if (!persist()) { entries.pop(); $("err").textContent = "Не се записа. Паметта на телефона може да е пълна."; return; }
  $("amount").value = ""; $("note").value = "";
  $("amount").blur();
  toast((type === "out" ? "−" : "+") + fmt(cents) + (type === "out" ? " · " + catName(cat) : " приход"));
  render();
}
function setType(t) {
  type = t;
  $("tOut").setAttribute("aria-pressed", t === "out");
  $("tIn").setAttribute("aria-pressed", t === "in");
  $("outBox").hidden = t !== "out";
  $("inBox").hidden = t !== "in";
  $("err").textContent = "";
}
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function render() {
  const all = [...entries].sort((a, b) => b.ts - a.ts);
  let bal = 0;
  for (const e of all) bal += e.type === "in" ? e.amount : -e.amount;
  $("balance").textContent = fmt(bal);
  $("balance").classList.toggle("c-out", bal < 0);

  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  let mIn = 0, mOut = 0; const byCat = {};
  for (const e of all) {
    if (e.ts < start) continue;
    if (e.type === "in") mIn += e.amount;
    else { mOut += e.amount; byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; }
  }
  $("monthName").textContent = monthFmt.format(now);
  $("mIn").textContent = fmt(mIn);
  $("mOut").textContent = fmt(mOut);

  const bars = $("bars"); bars.replaceChildren();
  const cats = CATS.filter(c => byCat[c.id]).sort((a, b) => byCat[b.id] - byCat[a.id]);
  if (!cats.length) bars.append(el("p", "empty", "Още няма разходи този месец."));
  else {
    const max = byCat[cats[0].id];
    for (const c of cats) {
      const row = el("div", "bar");
      const tr = el("div", "track"); const f = el("div", "fill");
      f.style.width = Math.max(3, byCat[c.id] / max * 100) + "%"; tr.append(f);
      row.append(el("span", "", c.name), tr, el("span", "num", fmt(byCat[c.id])));
      bars.append(row);
    }
  }

  const list = $("list"); list.replaceChildren();
  if (!all.length) list.append(el("p", "empty", "Няма записи. Напиши сума горе и избери за какво е."));
  for (const e of all.slice(0, shown)) {
    const row = el("div", "row");
    const what = el("div", "what");
    what.append(el("b", "", e.type === "in" ? "Приход" : catName(e.cat)),
                el("small", "", dateFmt.format(new Date(e.ts)) + (e.note ? " · " + e.note : "")));
    const amt = el("span", "amt num " + (e.type === "in" ? "c-in" : "c-out"), (e.type === "in" ? "+" : "−") + fmt(e.amount));
    const del = el("button", "del", "Изтрий"); del.type = "button";
    let timer;
    del.onclick = () => {
      if (!del.classList.contains("confirm")) {
        del.classList.add("confirm"); del.textContent = "Сигурен?";
        timer = setTimeout(() => { del.classList.remove("confirm"); del.textContent = "Изтрий"; }, 3000);
        return;
      }
      clearTimeout(timer);
      entries = entries.filter(x => x.id !== e.id); persist(); toast("Изтрито"); render();
    };
    row.append(what, amt, del); list.append(row);
  }
  $("more").hidden = all.length <= shown;
}

let tt;
function toast(t) { const n = $("toast"); n.textContent = t; n.hidden = false; clearTimeout(tt); tt = setTimeout(() => { n.hidden = true; }, 2200); }

for (const c of CATS) { const b = el("button", "", c.name); b.type = "button"; b.onclick = () => save(c.id); $("cats").append(b); }
$("tOut").onclick = () => setType("out");
$("tIn").onclick = () => setType("in");
$("addIn").onclick = () => save(null);
$("amount").addEventListener("keydown", ev => { if (ev.key === "Enter" && type === "in") save(null); });
$("more").onclick = () => { shown += 30; render(); };
window.addEventListener("storage", ev => { if (ev.key === KEY) { entries = load(); render(); } });
render();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
